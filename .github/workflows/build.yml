name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version tag
        id: meta
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          RAW_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH=$(echo "${RAW_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g' | sed 's/^-*//;s/-*$//')
          VERSION="1.${COMMIT_COUNT}-${BRANCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Parse registry host
        id: registry
        env:
          DOCKER_PUSH_URL: ${{ vars.DOCKER_PUSH_URL }}
          DOCKER_PUSH_USERNAME: ${{ secrets.DOCKER_PUSH_USERNAME }}
        run: |
          if [ -z "${DOCKER_PUSH_URL}" ]; then
            echo "DOCKER_PUSH_URL variable is not set" >&2
            exit 1
          fi
          HOST="${DOCKER_PUSH_URL%%/*}"
          # Use DockerHub username as the namespace (docker.io/{USER}/<image>).
          # If DOCKER_PUSH_URL already includes a path, trust it as-is.
          case "${DOCKER_PUSH_URL}" in
            */*) PREFIX="${DOCKER_PUSH_URL}" ;;
            *)   PREFIX="${DOCKER_PUSH_URL}/${DOCKER_PUSH_USERNAME}" ;;
          esac
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.DOCKER_PUSH_USERNAME }}
          password: ${{ secrets.DOCKER_PUSH_PASSWORD }}

      - name: Build (and push) image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.registry.outputs.prefix }}/postgres-operator:${{ steps.meta.outputs.version }}
            ${{ steps.registry.outputs.prefix }}/postgres-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint kopf \
            ${{ steps.registry.outputs.prefix }}/postgres-operator:${{ steps.meta.outputs.version }} --version

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2

      - name: Lint Helm chart
        run: |
          helm lint helm/postgres-operator \
            --set masterSecret.host=ci.placeholder \
            --set masterSecret.encryptedUsername=ci-placeholder-user \
            --set masterSecret.encryptedPassword=ci-placeholder-pass

      - name: Render Helm chart
        run: |
          helm template test helm/postgres-operator \
            --set masterSecret.host=ci.placeholder \
            --set masterSecret.encryptedUsername=ci-placeholder-user \
            --set masterSecret.encryptedPassword=ci-placeholder-pass \
            > /tmp/rendered.yaml
          head -n 5 /tmp/rendered.yaml

      - name: Package and push Helm chart
        if: github.event_name != 'pull_request'
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.DOCKER_PUSH_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.DOCKER_PUSH_PASSWORD }}
        run: |
          echo "${HELM_REGISTRY_PASSWORD}" | helm registry login \
            --username "${HELM_REGISTRY_USERNAME}" \
            --password-stdin \
            "${{ steps.registry.outputs.host }}"
          # Push chart under a separate name so it doesn't collide with the
          # image at docker.io/{user}/postgres-operator. Chart name in OCI
          # comes from Chart.yaml's `name`, so rewrite it in a copy.
          cp -r helm/postgres-operator /tmp/postgres-operator-helm
          sed -i 's/^name: postgres-operator$/name: postgres-operator-helm/' \
            /tmp/postgres-operator-helm/Chart.yaml
          helm package /tmp/postgres-operator-helm \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.version }}" \
            -d /tmp
          helm push /tmp/postgres-operator-helm-${{ steps.meta.outputs.version }}.tgz \
            oci://${{ steps.registry.outputs.prefix }}

image:
  repository: alphaprosoft/postgres-operator
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Master Postgres connection. Only username/password are kept secret (and
# rendered into a SealedSecret); host/port/database/sslmode are plain config.
masterSecret:
  # Name of the SealedSecret/Secret the operator reads (created in the release
  # namespace).
  name: postgres-master
  # Render the SealedSecret CR. Disable if the Secret is provisioned out of band.
  create: true
  # Plain connection parameters — passed to the operator as env vars.
  host: ""
  port: 5432
  database: postgres
  sslmode: prefer
  # kubeseal-encrypted ciphertexts. Required when create=true.
  # Generate with:
  #   echo -n "$USER" | kubeseal --raw --namespace <release-ns> --name <masterSecret.name>
  encryptedUsername: ""
  encryptedPassword: ""
  # Override only if your sealed-secrets controller exposes a non-default group.
  sealedApiVersion: bitnami.com/v1alpha1

installCRD: true

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
